name: Deploy Astro Blog to Synology NAS

on:
  push:
    branches:
      - main # 본인의 기본 브랜치 이름 (main 또는 master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Gitea에서 소스코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. 의존성 패키지 설치 및 정적 빌드
      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      # 4. 빌드 결과물(dist/)을 NAS 웹 폴더로 rsync 전송
      - name: Sync dist folder to NAS Web Station
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p ${{ secrets.NAS_PORT }} ${{ secrets.NAS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          rsync -avz -e "ssh -p ${{ secrets.NAS_PORT }} -o StrictHostKeyChecking=no" ./dist/ ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}:${{ secrets.NAS_TARGET_DIR }}