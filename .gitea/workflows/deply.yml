name: Deploy Astro Blog to Synology NAS

on:
  push:
    branches:
      - main # 기본 브랜치 이름 (main 또는 master)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Gitea에서 소스코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Node.js 환경 세팅
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. 의존성 패키지 설치 및 정적 빌드
      - name: Install dependencies and Build
        run: |
          npm ci
          npm run build

      # 4. rsync/ssh 패키지 설치 및 NAS 웹 폴더로 전송
      - name: Sync dist folder to NAS Web Station
        env:
          SSH_KEY: ${{ secrets.SSH_SSH_KEY }}
        run: |
          # 러너 도커 컨테이너 내 rsync 및 ssh 필수 패키지 설치
          sudo apt-get update && sudo apt-get install -y rsync openssh-client

          # SSH 비밀키 설정
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # NAS로 빌드 결과물(dist/) 전송
          rsync -avz -e "ssh -i ~/.ssh/id_rsa -p ${{ secrets.NAS_PORT }} -o StrictHostKeyChecking=no" ./dist/ ${{ secrets.NAS_USER }}@${{ secrets.NAS_HOST }}:${{ secrets.NAS_TARGET_DIR }}